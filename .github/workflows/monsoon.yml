name: Update monsoon data
on:
  schedule:
    # Backup only. GitHub often runs this late or skips it; cron-job.org is the main trigger.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two copies at once: both would rewrite monsoon.json and the second rebase would conflict.
concurrency:
  group: bkk-monsoon
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_monsoon.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monsoon.json
          if git diff --cached --quiet; then
            echo "monsoon.json unchanged"
            exit 0
          fi
          git commit -m "Update monsoon.json [skip ci]"
          # data.json and status.json workflows push to main too. Rebase (autostash covers any
          # other modified files) and retry if another push lands first.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep $((i * 4))
          done
          echo "could not push after 5 attempts"
          exit 1
