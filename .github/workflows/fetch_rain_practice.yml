name: Fetch 24h Rain Telemetry

on:
  workflow_dispatch: # Allows manual triggers from the GitHub Actions tab

jobs:
  fetch-rain-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Rain Telemetry Script
        run: python fetch_rain_practice.py

      - name: Commit and Push Updated Rain Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rain_dump.json rain_structure.json
          
          # Only commit if changes are detected
          if git diff --staged --quiet; then
            echo "No changes detected in rainfall telemetry files."
          else
            git commit -m "auto: update 24h rainfall telemetry [skip ci]"
            git push
          fi
