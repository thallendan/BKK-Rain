name: Practice Fetch NOAA SST Indices

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC

jobs:
  fetch-sst-indices:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run fetch_practice.py
        run: python fetch_practice.py

      - name: Commit and Push data_practice.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_practice.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update data_practice.json" && git push)
