name: Fetch Dam Practice Diagnostic

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    paths:
      - 'fetch_dam_practice.py'
      - '.github/workflows/fetch_dam_practice.yml'

jobs:
  run-dam-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run dam fetch practice script
        run: python fetch_dam_practice.py

      - name: Commit and push dam diagnostic outputs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dam_dump.html dam_structure.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update dam fetch diagnostic outputs [skip ci]" && git push)
