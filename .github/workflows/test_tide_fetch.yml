name: Test Tide Data Fetch

on:
  workflow_dispatch: # Allows manual run from GitHub Actions tab
  push:
    paths:
      - 'fetch_practice_tide.py'
      - '.github/workflows/test_tide_fetch.yml'

jobs:
  test-tide-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch_practice_tide.py
        run: python fetch_practice_tide.py

      - name: Print output JSON log
        run: cat data_practice_tide.json

      - name: Upload practice result artifact
        uses: actions/upload-artifact@v4
        with:
          name: tide-fetch-practice-data
          path: data_practice_tide.json
          retention-days: 7
